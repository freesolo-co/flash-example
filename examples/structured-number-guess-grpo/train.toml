model = "Qwen/Qwen3.5-0.8B"
algorithm = "grpo"
thinking = false

[environment]
id = "clay/structured-number-guess-grpo"

[environment.params]
num_examples = 24
max_turns = 7

[train]
epochs = 1
max_examples = 24
max_steps = 2
save_every = 1
batch_size = 4
group_size = 4
max_context_tokens = 512
max_completion_tokens = 64
lora_rank = 16
lora_alpha = 32
structured_outputs = '{"type":"object","properties":{"guess":{"type":"integer","minimum":1,"maximum":100}},"required":["guess"],"additionalProperties":false}'
