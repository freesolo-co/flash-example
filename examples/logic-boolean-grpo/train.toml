model = "Qwen/Qwen3.5-4B"
algorithm = "grpo"
thinking = false

[environment]
id = "clay/logic-boolean-grpo"

[train]
# teacher-free grpo over the environment-generated dataset
epochs = 10
max_examples = 24
max_steps = 50
save_every = 10
batch_size = 4
group_size = 4
max_context_tokens = 768
max_completion_tokens = 384
lora_rank = 16
lora_alpha = 32

[gpu]
type = "A100 PCIe"
provider = "runpod"
exact_type = "A100 PCIe"
