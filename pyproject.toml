[project]
name = "flash-example"
version = "0.1.0"
description = "End-to-end Flash training examples"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "freesolo>=0.2.54",
    "httpx>=0.27",
    "openai>=1.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
